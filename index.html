<!DOCTYPE html>
<!--
  PALETTE & PLAN
  Configurable dorm room planner — drag real furniture into a scaled floor plan, palette-matched and priced as you go.
  Joe.K · axisbim.io
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Configurable dorm room planner — drag real furniture into a scaled floor plan, palette-matched and priced as you go.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palette & Plan">
<meta name="theme-color" content="#0E1220" id="themeColorMeta">
<title>Palette & Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    /* Night — default */
    --paper: #0E1220;
    --paper-deep: #090C17;
    --card: #141829;
    --ink: #E7E4F4;
    --ink-soft: #A9A4C4;
    --line: #363B5C;
    --accent: #7C5CFC;
    --accent-deep: #6A4AE0;
    --accent-soft: rgba(124,92,252,0.16);
    --shadow: 0 1px 0 rgba(0,0,0,0.4), 0 8px 22px -10px rgba(0,0,0,0.7);
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', sans-serif;
    --font-ui: 'Inter', sans-serif;
    /* Plan canvas stays dark in both themes */
    --plan-canvas: #0E1220;
    --plan-line: #8F7EFF;
    --plan-line-soft: rgba(143,126,255,0.24);
  }
  :root[data-theme="light"]{
    /* Day — toggled */
    --paper: #F5F3FA;
    --paper-deep: #EDE9F6;
    --card: #FFFFFF;
    --ink: #221E2E;
    --ink-soft: #6B6580;
    --line: #DAD4EC;
    --accent: #7C5CFC;
    --accent-deep: #6A4AE0;
    --accent-soft: rgba(124,92,252,0.10);
    --shadow: 0 1px 0 rgba(34,30,46,0.04), 0 8px 22px -10px rgba(34,30,46,0.18);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    transition:background-color 0.25s ease, color 0.25s ease;
    overscroll-behavior-y:contain;
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:var(--font-ui); cursor:pointer;}
  ::selection{background:var(--accent); color:#fff;}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .btn{
    font-family:var(--font-ui); font-weight:600; font-size:13.5px;
    padding:10px 16px; border-radius:3px;
    border:1px solid var(--accent); background:var(--accent); color:#FBF6EE;
  }
  .btn.secondary{background:transparent; color:var(--ink); border-color:var(--line);}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--ink-soft); padding:6px 8px;}
  .btn:hover{opacity:0.92;}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}

  header.top{
    padding:calc(24px + env(safe-area-inset-top)) 20px 16px;
    position:relative;
    border-bottom:1px solid var(--line);
  }
  header.top .inner{ max-width:1400px; margin:0 auto; }
  header.top h1{
    font-family:var(--font-display); font-weight:600; margin:0 0 8px;
    font-size:clamp(28px, 4vw, 40px); letter-spacing:-0.01em;
  }
  header.top .tagline{
    font-family:var(--font-ui); font-size:12px; letter-spacing:0.08em;
    color:var(--ink-soft); margin:0; text-transform:uppercase;
  }
  .theme-toggle{
    position:absolute; top:calc(20px + env(safe-area-inset-top)); right:20px;
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:16px; padding:0;
  }
  main{max-width:1400px; margin:0 auto; padding:24px 20px calc(40px + env(safe-area-inset-bottom));}
  footer.foot{
    text-align:center;
    padding:18px 12px calc(30px + env(safe-area-inset-bottom));
    font-family:var(--font-ui); font-size:11px; letter-spacing:0.06em;
    color:var(--ink-soft); opacity:0.8;
  }

  /* ---- Toast ---- */
  .toast{
    position:fixed; bottom:calc(22px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper);
    font-family:var(--font-ui); font-size:13.5px; font-weight:600;
    padding:12px 20px; border-radius:6px; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:opacity 0.25s ease;
    z-index:50;
  }
  .toast.show{opacity:1;}

  /* ---- Confirm modal ---- */
  .confirm-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:60;
  }
  .confirm-box{
    background:var(--card); border-radius:6px; box-shadow:var(--shadow);
    padding:22px; max-width:360px; width:100%; border:1px solid var(--line);
  }
  .confirm-box p{
    font-family:var(--font-body); font-size:15px; color:var(--ink);
    margin:0 0 20px; line-height:1.5;
  }
  .confirm-actions{display:flex; gap:10px; justify-content:flex-end;}

  /* ---- Palette & Plan — tool-specific UI ---- */
  .intro{ max-width:60ch; color:var(--ink-soft); font-size:15px; line-height:1.55; margin:0 0 22px; }
  .group-label{ font-family:var(--font-ui); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 8px; }

  .palette-tabs{ display:flex; gap:28px; margin-bottom:24px; border-bottom:1px solid var(--line); }
  .palette-tabs button{
    background:none; border:none; font-family:var(--font-display); font-style:italic;
    font-size:17px; color:var(--ink-soft); padding:0 0 12px; cursor:pointer;
    border-bottom:2px solid transparent; transition:color 0.15s ease, border-color 0.15s ease;
  }
  .palette-tabs button.active{ color:var(--ink); border-bottom-color:var(--accent); }
  .palette-tabs button:hover{ color:var(--ink); }

  .layout{ display:grid; grid-template-columns:1.6fr 1fr; gap:28px; align-items:start; }
  @media (max-width:860px){ .layout{ grid-template-columns:1fr; } }

  .plan-card{ background:var(--plan-canvas); border-radius:4px; padding:20px; position:sticky; top:24px; }
  .plan-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .plan-head .group-label{ color:var(--plan-line); opacity:0.85; }
  .plan-head .btn.ghost{ color:var(--plan-line); font-size:12.5px; padding:4px 8px; }
  .plan-head .btn.ghost:hover{ opacity:0.75; }
  @media (max-width:860px){ .plan-card{ position:static; } }
  .plan-card svg{ width:100%; height:auto; display:block; touch-action:none; }

  .plan-caption{
    display:flex; justify-content:space-between; align-items:baseline; margin-top:14px;
    padding-top:12px; border-top:1px solid var(--plan-line-soft); color:var(--plan-line); font-size:12.5px;
  }
  .plan-caption span:first-child{ font-family:var(--font-display); font-style:italic; }

  .panel{ display:flex; flex-direction:column; gap:10px; }
  .cat-card{ background:var(--card); border:1px solid var(--line); border-radius:3px; padding:16px 18px; }
  .cat-card.unplaced .cat-head .price{ color:var(--ink-soft); font-style:italic; font-weight:400; }
  .cat-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .cat-head h3{ font-family:var(--font-display); font-weight:600; font-size:16.5px; margin:0; }
  .cat-head .price{ font-size:14.5px; font-weight:500; color:var(--accent); font-variant-numeric:tabular-nums; }

  .swatch-row{ display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  .swatch{
    display:flex; align-items:center; gap:10px; padding:11px 12px;
    border:1px solid var(--line); border-radius:3px; background:transparent; cursor:pointer;
    text-align:left; font-family:var(--font-ui); color:var(--ink);
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .swatch:hover{ border-color:var(--ink-soft); }
  .swatch.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .swatch-chip{ width:24px; height:24px; border-radius:2px; flex-shrink:0; border:1px solid var(--line); }
  .swatch-label{ display:flex; flex:1; justify-content:space-between; align-items:baseline; gap:8px; min-width:0; }
  .swatch-label .name{ font-size:14.5px; font-weight:600; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .swatch-label .price{ font-size:13px; font-weight:500; color:var(--ink-soft); flex-shrink:0; white-space:nowrap; }

  .summary{ background:var(--card); border:1px solid var(--line); border-radius:3px; padding:18px 20px; margin-top:6px; }
  .summary-total{ display:flex; justify-content:space-between; align-items:baseline; font-family:var(--font-display); font-size:19px; margin-bottom:14px; }
  .summary-total .amount{ color:var(--accent); }
  .btn-row{ display:flex; gap:10px; }
  .btn-row .btn{ flex:1; }
  .btn-row-secondary{ display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .btn-row-secondary .btn{ flex:1; min-width:120px; }

  .list-out{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); font-size:13px; color:var(--ink-soft); line-height:1.7; display:none; }
  .list-out.visible{ display:block; }
  .list-out .row{ display:flex; justify-content:space-between; }
  .list-out .row .n{ color:var(--ink); }
  .list-out .row .dim{ font-style:italic; opacity:0.75; }
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <h1>Palette &amp; Plan</h1>
    <p class="tagline">Drag-and-drop dorm room configurator</p>
  </div>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle midnight mode">🌙</button>
</header>

<main id="main"></main>

<div id="tooSmallBlock" style="display:none; position:fixed; inset:0; z-index:9999;
     background:var(--paper); color:var(--ink); flex-direction:column;
     align-items:center; justify-content:center; text-align:center; padding:32px;">
  <svg width="72" height="72" viewBox="0 0 72 72" style="margin-bottom:28px;">
    <rect x="6" y="6" width="60" height="60" fill="none" stroke="var(--plan-line)" stroke-width="2"/>
    <rect x="16" y="16" width="24" height="16" fill="none" stroke="var(--plan-line)" stroke-width="1.5"/>
    <rect x="44" y="38" width="14" height="18" fill="var(--accent)" opacity="0.55"/>
  </svg>
  <div style="width:60px; height:1px; background:var(--line); margin-bottom:24px;"></div>
  <h1 style="font-family:var(--font-display); font-weight:600; letter-spacing:0.02em; margin:0 0 20px; font-size:22px;">Palette &amp; Plan</h1>
  <p style="font-family:var(--font-body); color:var(--ink-soft); max-width:380px; line-height:1.6; margin:0 0 24px; font-size:14.5px;">
    This tool needs a tablet or desktop screen — dragging furniture into a scaled floor plan doesn't work well on a phone-sized display. Please open it on a larger screen.
  </p>
  <div style="width:60px; height:1px; background:var(--line); margin-bottom:24px;"></div>
  <p style="font-family:var(--font-ui); font-size:12px; letter-spacing:0.06em; color:var(--ink-soft);">
    Joe.K · axisbim.io
  </p>
</div>

<footer class="foot" id="footVersion"></footer>
<div class="toast" id="toast"></div>

<script>
const main = document.getElementById('main');
const APP_VERSION = '1.9.0'; // keep in sync with CHANGELOG.md's top entry and the footer tag below

/* ================= Toast ================= */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

/* Confirm dialog — replaces native confirm(), which iOS silently no-ops for
   home-screen-installed apps. Used by resetRoom(). */
function confirmDialog(message, confirmLabel = 'Confirm'){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p>${escapeHtml(message)}</p>
        <div class="confirm-actions">
          <button class="btn secondary" id="confirmCancel">Cancel</button>
          <button class="btn" id="confirmOk">${escapeHtml(confirmLabel)}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const cleanup = (result)=>{ overlay.remove(); resolve(result); };
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) cleanup(false); });
    document.getElementById('confirmCancel').onclick = ()=>cleanup(false);
    document.getElementById('confirmOk').onclick = ()=>cleanup(true);
  });
}

/* ================= Helpers ================= */
function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

/* View router — single screen today */
let view = 'home';
function setView(v){
  view = v;
  render();
  window.scrollTo(0, 0);
}
function render(){
  if(view === 'home') return renderHome();
}

/* ================= Room / furniture model ================= */
const SCALE = 40, MARGIN = 40;

// Wall openings are given as feet measured along that wall, from the (0,0) corner.
const roomPlans = [
  {
    id: 'nyu', label: 'NYU', w: 9, d: 12,
    door: { wall: 'south', from: 3.5, to: 5.5 },
    window: { wall: 'north', from: 1, to: 4 },
    closet: { x: 7.5, y: 0, w: 1.5, d: 2 }
  },
  {
    id: 'green-university', label: 'Green University', w: 11, d: 10,
    door: { wall: 'south', from: 4.5, to: 6.5 },
    window: { wall: 'east', from: 2, to: 5 },
    closet: { x: 0, y: 0, w: 1.5, d: 2 }
  }
];

let ROOM_W, ROOM_D, ROOM_BOTTOM, TRAY_TOP, TRAY_H, svgW, svgH;
function applyRoomPlan(plan){
  ROOM_W = plan.w;
  ROOM_D = plan.d;
  ROOM_BOTTOM = MARGIN + ROOM_D * SCALE;
  TRAY_TOP = ROOM_BOTTOM + 64;
  TRAY_H = 108;
  svgW = ROOM_W * SCALE + MARGIN * 2;
  svgH = TRAY_TOP + TRAY_H;
}
applyRoomPlan(roomPlans[0]);

const palettes = [
  { id: 'scandi', label: 'Scandi Calm' },
  { id: 'dark-academia', label: 'Dark Academia' },
  { id: 'frat-boy', label: 'Frat Boy' },
  { id: 'girly', label: 'Girly' }
];

// category footprints in feet — no fixed position; placement is drag-driven
const categories = [
  { id: 'bed',   label: 'Bed',   w: 3.3, d: 6.5 },
  { id: 'desk',  label: 'Desk',  w: 2.3, d: 1.8 },
  { id: 'chair', label: 'Chair', w: 1.6, d: 1.6 },
  { id: 'lamp',  label: 'Lamp',  w: 0.5, d: 0.5 },
  { id: 'rug',   label: 'Rug',   w: 4,   d: 3 }
];

const products = {
  bed: [
    { id: 'sc-bed', palette: 'scandi', name: 'Oslo Frame Bed', color: '#E8E2D8', price: 249 },
    { id: 'da-bed', palette: 'dark-academia', name: 'Wren Frame Bed', color: '#3A2E28', price: 329 },
    { id: 'fb-bed', palette: 'frat-boy', name: 'Bunker Bed Frame', color: '#333F4D', price: 199 },
    { id: 'gl-bed', palette: 'girly', name: 'Blush Canopy Bed', color: '#E7C2C9', price: 289 }
  ],
  desk: [
    { id: 'sc-desk', palette: 'scandi', name: 'Birk Desk', color: '#DED6C4', price: 189 },
    { id: 'da-desk', palette: 'dark-academia', name: 'Hollis Writing Desk', color: '#4A3B2E', price: 259 },
    { id: 'fb-desk', palette: 'frat-boy', name: 'Gameday Desk', color: '#5C4530', price: 149 },
    { id: 'gl-desk', palette: 'girly', name: 'Vanity Desk', color: '#F1E6DA', price: 229 }
  ],
  chair: [
    { id: 'sc-chair', palette: 'scandi', name: 'Fenn Chair', color: '#C9B79A', price: 129 },
    { id: 'da-chair', palette: 'dark-academia', name: 'Aldric Armchair', color: '#5C4632', price: 189 },
    { id: 'fb-chair', palette: 'frat-boy', name: 'Bleacher Gaming Chair', color: '#7A2E2E', price: 159 },
    { id: 'gl-chair', palette: 'girly', name: 'Boucle Vanity Chair', color: '#D89AA6', price: 179 }
  ],
  lamp: [
    { id: 'sc-lamp', palette: 'scandi', name: 'Bough Lamp', color: '#D9CFC1', price: 45 },
    { id: 'da-lamp', palette: 'dark-academia', name: 'Brass Task Lamp', color: '#8A6A3A', price: 68 },
    { id: 'fb-lamp', palette: 'frat-boy', name: 'Neon Sign Lamp', color: '#D9A62B', price: 39 },
    { id: 'gl-lamp', palette: 'girly', name: 'Pearl Vanity Lamp', color: '#EAD9B8', price: 58 }
  ],
  rug: [
    { id: 'sc-rug', palette: 'scandi', name: 'Nordic Stripe Rug', color: '#EDE7DC', price: 79 },
    { id: 'da-rug', palette: 'dark-academia', name: 'Bordeaux Kilim Rug', color: '#5A2A28', price: 99 },
    { id: 'fb-rug', palette: 'frat-boy', name: 'Turf Zone Rug', color: '#3F6B44', price: 49 },
    { id: 'gl-rug', palette: 'girly', name: 'Cloud Faux-Fur Rug', color: '#F4E9EC', price: 95 }
  ]
};

const state = {
  palette: 'scandi',
  roomPlan: 'nyu',
  picks: {},
  positions: {},
  rotations: {}
};
categories.forEach(c => {
  state.picks[c.id] = products[c.id].find(p => p.palette === state.palette).id;
  state.positions[c.id] = null; // null = sitting in the tray, unplaced
  state.rotations[c.id] = 0;    // degrees: 0 / 90 / 180 / 270
});

function productById(catId, prodId){ return products[catId].find(p => p.id === prodId); }
function fx(v){ return (v * SCALE + MARGIN).toFixed(1); }
function fy(v){ return (v * SCALE + MARGIN).toFixed(1); }
function total(){ return placedCategories().reduce((sum, c) => sum + productById(c.id, state.picks[c.id]).price, 0); }
function placedCategories(){ return categories.filter(c => state.positions[c.id]); }

function resetRoom(){
  if (placedCategories().length === 0) { toast('Room is already empty'); return; }
  confirmDialog('Clear everything currently placed in the room?', 'Reset room').then(ok => {
    if (!ok) return;
    categories.forEach(c => {
      state.positions[c.id] = null;
      state.rotations[c.id] = 0;
    });
    renderPlanSvg();
    renderPanel();
    toast('Room reset');
  });
}

// The room-facing bounding box at a given rotation — 90°/270° swap w/d.
function bboxFor(cat, rotation){
  return (rotation === 90 || rotation === 270)
    ? { bw: cat.d, bh: cat.w }
    : { bw: cat.w, bh: cat.d };
}

function luminance(hex){
  const c = hex.replace('#', '');
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  return 0.299*r + 0.587*g + 0.114*b;
}

function furnitureShape(catId, x, y, w, h, color){
  const stroke = luminance(color) > 150 ? 'rgba(0,0,0,0.4)' : 'rgba(255,255,255,0.45)';
  let s = '';

  if (catId === 'lamp') {
    const cx = x + w/2, cy = y + h/2, r = Math.min(w,h)/2;
    s += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${color}" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>`;
    s += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(r*0.3).toFixed(1)}" fill="none" stroke="${stroke}" stroke-width="1"/>`;
    [0, 90, 180, 270].forEach(deg => {
      const rad = deg * Math.PI / 180;
      const x1 = cx + Math.cos(rad)*r*0.85, y1 = cy + Math.sin(rad)*r*0.85;
      const x2 = cx + Math.cos(rad)*r*1.15, y2 = cy + Math.sin(rad)*r*1.15;
      s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${stroke}" stroke-width="1"/>`;
    });
    return s;
  }

  s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${color}" stroke="rgba(0,0,0,0.25)" stroke-width="1" rx="2"/>`;

  if (catId === 'bed') {
    const pillowW = w*0.55, pillowH = h*0.12, px = x + (w-pillowW)/2, py = y + h*0.08;
    s += `<rect x="${px.toFixed(1)}" y="${py.toFixed(1)}" width="${pillowW.toFixed(1)}" height="${pillowH.toFixed(1)}" fill="none" stroke="${stroke}" stroke-width="1" rx="3"/>`;
    const foldY = y + h*0.3;
    s += `<line x1="${(x+4).toFixed(1)}" y1="${foldY.toFixed(1)}" x2="${(x+w-4).toFixed(1)}" y2="${foldY.toFixed(1)}" stroke="${stroke}" stroke-width="1"/>`;
  } else if (catId === 'desk') {
    const inset = Math.min(w,h)*0.16;
    s += `<rect x="${(x+inset).toFixed(1)}" y="${(y+inset).toFixed(1)}" width="${(w-inset*2).toFixed(1)}" height="${(h-inset*2).toFixed(1)}" fill="none" stroke="${stroke}" stroke-width="1"/>`;
  } else if (catId === 'chair') {
    s += `<line x1="${(x+3).toFixed(1)}" y1="${(y+4).toFixed(1)}" x2="${(x+w-3).toFixed(1)}" y2="${(y+4).toFixed(1)}" stroke="${stroke}" stroke-width="3"/>`;
  } else if (catId === 'rug') {
    const inset = Math.min(w,h)*0.1;
    s += `<rect x="${(x+inset).toFixed(1)}" y="${(y+inset).toFixed(1)}" width="${(w-inset*2).toFixed(1)}" height="${(h-inset*2).toFixed(1)}" fill="none" stroke="${stroke}" stroke-width="1" stroke-dasharray="4 3" rx="2"/>`;
  }
  return s;
}

// A door/window spans from/to feet measured along the given wall, from (0,0).
function wallOpeningLine(wall, fromFt, toFt, strokeVar, widthPx){
  let x1, y1, x2, y2;
  if (wall === 'north') { y1 = y2 = fy(0); x1 = fx(fromFt); x2 = fx(toFt); }
  else if (wall === 'south') { y1 = y2 = fy(ROOM_D); x1 = fx(fromFt); x2 = fx(toFt); }
  else if (wall === 'west') { x1 = x2 = fx(0); y1 = fy(fromFt); y2 = fy(toFt); }
  else { x1 = x2 = fx(ROOM_W); y1 = fy(fromFt); y2 = fy(toFt); }
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${strokeVar}" stroke-width="${widthPx}"/>`;
}

// Short dashed tick hinting at a door swing, without per-wall arc geometry.
function doorSwingTick(wall, hingeFt){
  const depth = 2;
  let x1, y1, x2, y2;
  if (wall === 'north') { x1 = x2 = fx(hingeFt); y1 = fy(0); y2 = fy(depth); }
  else if (wall === 'south') { x1 = x2 = fx(hingeFt); y1 = fy(ROOM_D); y2 = fy(ROOM_D - depth); }
  else if (wall === 'west') { y1 = y2 = fy(hingeFt); x1 = fx(0); x2 = fx(depth); }
  else { y1 = y2 = fy(hingeFt); x1 = fx(ROOM_W); x2 = fx(ROOM_W - depth); }
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--plan-line)" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>`;
}

function closetMarkup(closet){
  const x = fx(closet.x), y = fy(closet.y), w = closet.w * SCALE, h = closet.d * SCALE;
  const labelX = fx(closet.x + closet.w / 2), labelY = fy(closet.y + closet.d / 2);
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="var(--plan-line)" stroke-width="1.5" stroke-dasharray="3 3"/>` +
    `<text x="${labelX}" y="${labelY}" fill="var(--plan-line)" font-size="10.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="Inter, sans-serif">CLOSET</text>`;
}

function renderPlanSvg(){
  const plan = roomPlans.find(p => p.id === state.roomPlan);
  let parts = [];

  for (let gx = 0; gx <= ROOM_W; gx++) {
    const x = fx(gx);
    parts.push(`<line x1="${x}" y1="${MARGIN}" x2="${x}" y2="${MARGIN + ROOM_D*SCALE}" stroke="var(--plan-line-soft)" stroke-width="1"/>`);
  }
  for (let gy = 0; gy <= ROOM_D; gy++) {
    const y = fy(gy);
    parts.push(`<line x1="${MARGIN}" y1="${y}" x2="${MARGIN + ROOM_W*SCALE}" y2="${y}" stroke="var(--plan-line-soft)" stroke-width="1"/>`);
  }

  parts.push(`<rect x="${MARGIN}" y="${MARGIN}" width="${ROOM_W*SCALE}" height="${ROOM_D*SCALE}" fill="none" stroke="var(--plan-line)" stroke-width="2"/>`);

  parts.push(closetMarkup(plan.closet));

  parts.push(wallOpeningLine(plan.door.wall, plan.door.from, plan.door.to, 'var(--plan-canvas)', 4));
  parts.push(doorSwingTick(plan.door.wall, plan.door.from));

  parts.push(wallOpeningLine(plan.window.wall, plan.window.from, plan.window.to, 'var(--plan-line)', 4));

  // placed furniture — rug first (under everything), lamp last (on top)
  const order = ['rug', 'bed', 'desk', 'chair', 'lamp'];
  order.forEach(catId => {
    const cat = categories.find(c => c.id === catId);
    const pos = state.positions[catId];
    if (!pos) return;
    const prod = productById(catId, state.picks[catId]);
    const rot = state.rotations[catId] || 0;
    const bbox = bboxFor(cat, rot);

    // center of the rotated bbox — position is always this box's top-left
    const centerXFt = pos.x + bbox.bw / 2;
    const centerYFt = pos.y + bbox.bh / 2;
    const centerPxX = fx(centerXFt), centerPxY = fy(centerYFt);

    // shape drawn at true intrinsic w×d, centered here, then rotated in place
    const rectXFt = centerXFt - cat.w / 2, rectYFt = centerYFt - cat.d / 2;
    const rectPxX = parseFloat(fx(rectXFt)), rectPxY = parseFloat(fy(rectYFt));
    const wPx = cat.w * SCALE, hPx = cat.d * SCALE;

    parts.push(`<g class="drag-item" data-cat="${catId}" style="cursor:grab;touch-action:none;">`);
    parts.push(`<g transform="rotate(${rot} ${centerPxX} ${centerPxY})">`);
    parts.push(furnitureShape(catId, rectPxX, rectPxY, wPx, hPx, prod.color));
    parts.push(`</g>`);

    if (bbox.bw >= 1.2) {
      const labelColor = luminance(prod.color) > 150 ? '#221F1A' : '#F3F0E6';
      const dimText = `${bbox.bw.toFixed(1)}' × ${bbox.bh.toFixed(1)}'`;
      parts.push(`<text x="${centerPxX}" y="${(parseFloat(centerPxY)-6).toFixed(1)}" fill="${labelColor}" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="Inter, sans-serif" opacity="0.88">${escapeHtml(cat.label)}</text>`);
      parts.push(`<text x="${centerPxX}" y="${(parseFloat(centerPxY)+10).toFixed(1)}" fill="${labelColor}" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle" font-family="Inter, sans-serif" opacity="0.7">${dimText}</text>`);
    }

    if (catId !== 'lamp') {
      const hx = fx(pos.x + bbox.bw - 0.35);
      const hy = fy(pos.y + 0.35);
      parts.push(`<g class="rotate-handle" data-cat="${catId}" style="cursor:pointer;">`);
      parts.push(`<circle cx="${hx}" cy="${hy}" r="10" fill="var(--plan-canvas)" stroke="var(--plan-line)" stroke-width="1"/>`);
      parts.push(`<text x="${hx}" y="${hy}" fill="var(--plan-line)" font-size="12" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif">&#8635;</text>`);
      parts.push(`</g>`);
    }

    parts.push(`</g>`);
  });

  parts.push(`<text x="${MARGIN + ROOM_W*SCALE/2}" y="${ROOM_BOTTOM + 20}" fill="var(--plan-line)" font-size="12" font-weight="500" text-anchor="middle" font-family="Inter, sans-serif">${ROOM_W}' - 0"</text>`);
  parts.push(`<text x="16" y="${MARGIN + ROOM_D*SCALE/2}" fill="var(--plan-line)" font-size="12" font-weight="500" text-anchor="middle" font-family="Inter, sans-serif" transform="rotate(-90 16 ${MARGIN + ROOM_D*SCALE/2})">${ROOM_D}' - 0"</text>`);

  // tray — unplaced items, drag up into the room
  parts.push(`<line x1="${MARGIN}" y1="${TRAY_TOP - 34}" x2="${svgW - MARGIN}" y2="${TRAY_TOP - 34}" stroke="var(--plan-line-soft)" stroke-width="1"/>`);
  parts.push(`<text x="${MARGIN}" y="${TRAY_TOP - 16}" fill="var(--plan-line)" font-size="10.5" font-weight="600" font-family="Inter, sans-serif" opacity="0.85">DRAG INTO ROOM</text>`);
  parts.push(`<rect x="${MARGIN}" y="${TRAY_TOP}" width="${ROOM_W*SCALE}" height="${TRAY_H}" fill="none" stroke="var(--plan-line-soft)" stroke-width="1" stroke-dasharray="3 4" rx="4"/>`);

  const traySlotW = (ROOM_W * SCALE) / categories.length;
  categories.forEach((cat, i) => {
    const pos = state.positions[cat.id];
    if (pos) return;
    const prod = productById(cat.id, state.picks[cat.id]);
    const cx = MARGIN + traySlotW * (i + 0.5);
    const cy = TRAY_TOP + 40;
    const boxSize = 36;
    const bx = cx - boxSize/2, by = cy - boxSize/2;
    parts.push(`<g class="drag-item" data-cat="${cat.id}" style="cursor:grab;touch-action:none;">`);
    parts.push(furnitureShape(cat.id, bx, by, boxSize, boxSize, prod.color));
    parts.push(`</g>`);
    parts.push(`<text x="${cx}" y="${TRAY_TOP + 78}" fill="var(--ink-soft)" font-size="11" font-weight="500" text-anchor="middle" font-family="Inter, sans-serif">${escapeHtml(cat.label)}</text>`);
  });

  const svg = document.getElementById('planSvg');
  if (svg) {
    svg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);
    svg.innerHTML = parts.join('');
  }
}

/* ================= Drag interaction ================= */
let dragState = null; // { catId, offX, offY } offsets in feet

function svgPoint(evt){
  const svg = document.getElementById('planSvg');
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX;
  pt.y = evt.clientY;
  const ctm = svg.getScreenCTM();
  if (!ctm) return { xFt: 0, yFt: 0, rawY: 0 };
  const loc = pt.matrixTransform(ctm.inverse());
  return { xFt: (loc.x - MARGIN) / SCALE, yFt: (loc.y - MARGIN) / SCALE, rawY: loc.y };
}

function setupDrag(){
  const svg = document.getElementById('planSvg');
  if (!svg || svg.dataset.dragBound) return;
  svg.dataset.dragBound = '1';

  svg.addEventListener('pointerdown', (e) => {
    const rotHandle = e.target.closest('.rotate-handle');
    if (rotHandle) {
      const catId = rotHandle.dataset.cat;
      const cat = categories.find(c => c.id === catId);
      state.rotations[catId] = ((state.rotations[catId] || 0) + 90) % 360;
      const pos = state.positions[catId];
      if (pos) {
        const bbox = bboxFor(cat, state.rotations[catId]);
        pos.x = Math.max(0, Math.min(ROOM_W - bbox.bw, pos.x));
        pos.y = Math.max(0, Math.min(ROOM_D - bbox.bh, pos.y));
      }
      renderPlanSvg();
      e.stopPropagation();
      e.preventDefault();
      return;
    }
    const g = e.target.closest('.drag-item');
    if (!g) return;
    const catId = g.dataset.cat;
    const cat = categories.find(c => c.id === catId);
    const pos = state.positions[catId];
    const p = svgPoint(e);
    let originX, originY;
    if (pos) {
      originX = pos.x; originY = pos.y;
    } else {
      const bbox = bboxFor(cat, state.rotations[catId] || 0);
      originX = p.xFt - bbox.bw / 2;
      originY = p.yFt - bbox.bh / 2;
    }
    dragState = { catId, offX: p.xFt - originX, offY: p.yFt - originY };
    svg.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  svg.addEventListener('pointermove', (e) => {
    if (!dragState) return;
    const cat = categories.find(c => c.id === dragState.catId);
    const bbox = bboxFor(cat, state.rotations[dragState.catId] || 0);
    const p = svgPoint(e);
    let nx = p.xFt - dragState.offX;
    let ny = p.yFt - dragState.offY;
    nx = Math.max(0, Math.min(ROOM_W - bbox.bw, nx));
    state.positions[dragState.catId] = { x: nx, y: ny };
    renderPlanSvg();
  });

  function endDrag(e){
    if (!dragState) return;
    const catId = dragState.catId;
    const cat = categories.find(c => c.id === catId);
    const bbox = bboxFor(cat, state.rotations[catId] || 0);
    const p = svgPoint(e);
    if (p.rawY >= TRAY_TOP - 12) {
      state.positions[catId] = null;
      state.rotations[catId] = 0; // reset orientation when it goes back to the tray
    } else {
      const pos = state.positions[catId];
      let nx = Math.max(0, Math.min(ROOM_W - bbox.bw, pos.x));
      let ny = Math.max(0, Math.min(ROOM_D - bbox.bh, pos.y));
      nx = Math.round(nx * 4) / 4;
      ny = Math.round(ny * 4) / 4;
      state.positions[catId] = { x: nx, y: ny };
    }
    dragState = null;
    renderPlanSvg();
    renderPanel();
  }

  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', () => { dragState = null; });
}

/* ================= Panel ================= */
function renderRoomTabs(){
  const el = document.getElementById('roomTabs');
  if (!el) return;
  el.innerHTML = roomPlans.map(p =>
    `<button data-r="${escapeAttr(p.id)}" class="${p.id === state.roomPlan ? 'active' : ''}">${escapeHtml(p.label)}</button>`
  ).join('');
  el.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.r === state.roomPlan) return;
      const hadPlacedItems = placedCategories().length > 0;
      state.roomPlan = btn.dataset.r;
      applyRoomPlan(roomPlans.find(p => p.id === state.roomPlan));
      categories.forEach(c => {
        state.positions[c.id] = null;
        state.rotations[c.id] = 0;
      });
      renderRoomTabs();
      renderPlanSvg();
      renderPanel();
      renderPlanCaption();
      if (hadPlacedItems) toast('Switched room plan — room cleared');
    });
  });
}

function renderPlanCaption(){
  const el = document.getElementById('planCaption');
  if (!el) return;
  const plan = roomPlans.find(p => p.id === state.roomPlan);
  el.innerHTML = `<span>${escapeHtml(plan.label)} — ${plan.w}' × ${plan.d}'</span><span>Scale 1 sq = 1 ft</span>`;
}

function renderTabs(){
  const el = document.getElementById('paletteTabs');
  if (!el) return;
  el.innerHTML = palettes.map(p =>
    `<button data-p="${escapeAttr(p.id)}" class="${p.id === state.palette ? 'active' : ''}">${escapeHtml(p.label)}</button>`
  ).join('');
  el.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      state.palette = btn.dataset.p;
      categories.forEach(c => {
        state.picks[c.id] = products[c.id].find(p => p.palette === state.palette).id;
      });
      renderPlanSvg();
      renderPanel();
      renderTabs();
    });
  });
}

function renderPanel(){
  const el = document.getElementById('panel');
  if (!el) return;
  let html = categories.map(cat => {
    const placed = !!state.positions[cat.id];
    const swatches = products[cat.id].map(p => `
      <button class="swatch ${state.picks[cat.id] === p.id ? 'selected' : ''}" data-cat="${escapeAttr(cat.id)}" data-prod="${escapeAttr(p.id)}">
        <span class="swatch-chip" style="background:${p.color}"></span>
        <span class="swatch-label">
          <span class="name">${escapeHtml(p.name)}</span>
          <span class="price">$${p.price}</span>
        </span>
      </button>
    `).join('');
    const picked = productById(cat.id, state.picks[cat.id]);
    return `
      <div class="cat-card ${placed ? '' : 'unplaced'}">
        <div class="cat-head">
          <h3>${escapeHtml(cat.label)}</h3>
          <span class="price">${placed ? `$${picked.price}` : 'Not in room'}</span>
        </div>
        <div class="swatch-row">${swatches}</div>
      </div>
    `;
  }).join('');

  html += `
    <div class="summary">
      <div class="summary-total">
        <span>Room total</span>
        <span class="amount">$${total()}</span>
      </div>
      <div class="btn-row">
        <button class="btn" id="genBtn">Generate look</button>
        <button class="btn secondary" id="downloadBtn">Download plan</button>
      </div>
      <div class="btn-row-secondary">
        <button class="btn secondary" id="pdfBtn">Export PDF</button>
        <button class="btn secondary" id="shareBtn">Copy link</button>
      </div>
      <div class="list-out" id="listOut"></div>
    </div>
  `;

  el.innerHTML = html;

  el.querySelectorAll('.swatch').forEach(btn => {
    btn.addEventListener('click', () => {
      state.picks[btn.dataset.cat] = btn.dataset.prod;
      renderPlanSvg();
      renderPanel();
    });
  });

  document.getElementById('genBtn').addEventListener('click', () => {
    const out = document.getElementById('listOut');
    out.classList.add('visible');
    const placed = placedCategories();
    if (placed.length === 0) {
      out.innerHTML = `<div class="row"><span>Nothing placed in the room yet — drag an item in first.</span></div>`;
      toast('Room is empty');
      return;
    }
    out.innerHTML = placed.map(c => {
      const p = productById(c.id, state.picks[c.id]);
      const bbox = bboxFor(c, state.rotations[c.id] || 0);
      const dim = `${bbox.bw.toFixed(1)}' × ${bbox.bh.toFixed(1)}'`;
      return `<div class="row"><span>${escapeHtml(c.label)} — ${escapeHtml(p.name)} <span class="dim">(${dim})</span></span><span class="n">$${p.price}</span></div>`;
    }).join('') + `<div class="row" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px;"><span><strong>Total</strong></span><span class="n"><strong>$${total()}</strong></span></div>`;
    toast('Shopping list ready');
  });

  document.getElementById('downloadBtn').addEventListener('click', downloadPlanImage);
  document.getElementById('pdfBtn').addEventListener('click', downloadPlanPDF);
  document.getElementById('shareBtn').addEventListener('click', copyShareLink);
}

/* ================= Plan export (shared canvas + PNG/PDF outputs) =================
   buildPlanCanvas() does all the SVG->canvas rendering once; downloadPlanImage()
   and downloadPlanPDF() just package that same canvas differently, so the two
   export formats can never visually drift apart from each other. */
function buildPlanCanvas(onReady, onError){
  try {
    const svg = document.getElementById('planSvg');
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('width', svgW);
    clone.setAttribute('height', svgH);

    const planCanvas = getComputedStyle(document.documentElement).getPropertyValue('--plan-canvas').trim() || '#0E1220';
    const planLine = getComputedStyle(document.documentElement).getPropertyValue('--plan-line').trim() || '#8F7EFF';
    const planLineSoft = getComputedStyle(document.documentElement).getPropertyValue('--plan-line-soft').trim() || 'rgba(143,126,255,0.24)';

    let svgStr = new XMLSerializer().serializeToString(clone);
    svgStr = svgStr.split('var(--plan-line-soft)').join(planLineSoft);
    svgStr = svgStr.split('var(--plan-line)').join(planLine);
    svgStr = svgStr.split('var(--plan-canvas)').join(planCanvas);

    const bgRect = `<rect x="0" y="0" width="${svgW}" height="${svgH}" fill="${planCanvas}"/>`;
    svgStr = svgStr.replace(/(<svg[^>]*>)/, `$1${bgRect}`);

    const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = function(){
      const scaleUp = 2;
      const rowH = 26;
      const listTop = svgH + 34;
      const placed = placedCategories();
      const rowCount = Math.max(placed.length, 1); // reserve one row for the "nothing placed" message
      const listH = rowCount * rowH + 74;
      const canvasH = listTop + listH;

      const canvas = document.createElement('canvas');
      canvas.width = svgW * scaleUp;
      canvas.height = canvasH * scaleUp;
      const ctx = canvas.getContext('2d');
      ctx.scale(scaleUp, scaleUp);

      ctx.drawImage(img, 0, 0, svgW, svgH);

      ctx.fillStyle = '#141829';
      ctx.fillRect(0, svgH, svgW, listH);
      ctx.fillStyle = 'rgba(143,126,255,0.2)';
      ctx.fillRect(0, svgH, svgW, 1);

      ctx.textBaseline = 'alphabetic';
      let y = listTop;
      if (placed.length === 0) {
        ctx.fillStyle = '#8E8AA8';
        ctx.font = 'italic 13px Inter, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('Nothing placed in the room yet.', 24, y);
        y += rowH;
      } else {
        placed.forEach(cat => {
          const p = productById(cat.id, state.picks[cat.id]);
          const bbox = bboxFor(cat, state.rotations[cat.id] || 0);
          const dim = `${bbox.bw.toFixed(1)}' × ${bbox.bh.toFixed(1)}'`;
          ctx.fillStyle = 'rgba(143,126,255,0.6)';
          ctx.fillRect(24, y - 11, 12, 12);
          ctx.font = '13px Inter, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillStyle = '#E7E4F4';
          const mainText = `${cat.label} — ${p.name} `;
          ctx.fillText(mainText, 46, y);
          const mainWidth = ctx.measureText(mainText).width;
          ctx.font = 'italic 12px Inter, sans-serif';
          ctx.fillStyle = '#8E8AA8';
          ctx.fillText(`(${dim})`, 46 + mainWidth, y);
          ctx.font = '13px Inter, sans-serif';
          ctx.fillStyle = '#8E8AA8';
          ctx.textAlign = 'right';
          ctx.fillText(`$${p.price}`, svgW - 24, y);
          y += rowH;
        });
      }

      y += 6;
      ctx.fillStyle = 'rgba(143,126,255,0.25)';
      ctx.fillRect(24, y - 16, svgW - 48, 1);
      y += 22;
      ctx.font = '600 16px Fraunces, serif';
      ctx.fillStyle = '#E7E4F4';
      ctx.textAlign = 'left';
      ctx.fillText('Room total', 24, y);
      ctx.fillStyle = '#7C5CFC';
      ctx.textAlign = 'right';
      ctx.fillText(`$${total()}`, svgW - 24, y);

      URL.revokeObjectURL(url);
      onReady(canvas);
    };
    img.onerror = function(){
      console.error('Plan export failed to render.');
      onError();
    };
    img.src = url;
  } catch (e) {
    console.error('Export failed', e);
    onError();
  }
}

function downloadPlanImage(){
  buildPlanCanvas(function(canvas){
    canvas.toBlob(function(blob){
      if (!blob) { toast('Download failed — try again'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'dorm-room-plan.png';
      a.click();
      toast('Plan saved as PNG');
    });
  }, function(){ toast('Download failed — try again'); });
}

// Same rendered canvas as the PNG export, just placed as a single full-bleed
// image on a PDF page sized to match its exact proportions (no wasted margin,
// no re-layout) — the fast option, not a re-typeset document.
function downloadPlanPDF(){
  if (!window.jspdf || !window.jspdf.jsPDF) {
    toast('PDF export unavailable — check your connection and try again');
    return;
  }
  buildPlanCanvas(function(canvas){
    try {
      const { jsPDF } = window.jspdf;
      const pageW = canvas.width / 2;  // canvas is rendered at 2x scale; use CSS-pixel size for the page
      const pageH = canvas.height / 2;
      const pdf = new jsPDF({
        orientation: pageW > pageH ? 'landscape' : 'portrait',
        unit: 'pt',
        format: [pageW, pageH]
      });
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, pageW, pageH);
      pdf.save('dorm-room-plan.pdf');
      toast('Plan saved as PDF');
    } catch (e) {
      console.error('PDF export failed', e);
      toast('Download failed — try again');
    }
  }, function(){ toast('Download failed — try again'); });
}

/* ================= Shareable link =================
   The entire configurable state (room plan, palette, per-category product
   picks, positions, rotations) round-trips through a base64 blob in the URL
   hash — no backend, no accounts, matches every other tool in this suite. */
function shareStateObj(){
  return { r: state.roomPlan, p: state.palette, k: state.picks, s: state.positions, o: state.rotations };
}
function buildShareUrl(){
  const encoded = btoa(JSON.stringify(shareStateObj()));
  const url = new URL(window.location.href);
  url.hash = 's=' + encoded;
  return url.toString();
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  toast(ok ? 'Link copied' : 'Could not copy — copy it from the address bar');
}
function copyShareLink(){
  const url = buildShareUrl();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(
      () => toast('Link copied'),
      () => fallbackCopy(url)
    );
  } else {
    fallbackCopy(url);
  }
}
// Reads a `#s=<base64>` hash on load and restores that exact room. Every
// field is validated against the real catalog/room data before it's applied,
// and positions are re-clamped to the restored room's bounds — a malformed
// or stale link degrades to "ignore that field," never a crash or an
// out-of-bounds item.
function restoreFromHash(){
  if (!location.hash) return;
  let obj;
  try {
    const params = new URLSearchParams(location.hash.slice(1));
    const encoded = params.get('s');
    if (!encoded) return;
    obj = JSON.parse(atob(encoded));
  } catch (e) {
    toast('Could not read that share link');
    return;
  }
  if (obj.r && roomPlans.find(p => p.id === obj.r)) {
    state.roomPlan = obj.r;
    applyRoomPlan(roomPlans.find(p => p.id === obj.r));
  }
  if (obj.p && palettes.find(p => p.id === obj.p)) state.palette = obj.p;
  if (obj.k && typeof obj.k === 'object') {
    categories.forEach(c => {
      const pick = obj.k[c.id];
      if (pick && productById(c.id, pick)) state.picks[c.id] = pick;
    });
  }
  if (obj.o && typeof obj.o === 'object') {
    categories.forEach(c => {
      const rot = obj.o[c.id];
      state.rotations[c.id] = [0, 90, 180, 270].includes(rot) ? rot : 0;
    });
  }
  if (obj.s && typeof obj.s === 'object') {
    categories.forEach(c => {
      const pos = obj.s[c.id];
      if (pos && typeof pos.x === 'number' && typeof pos.y === 'number') {
        const bbox = bboxFor(c, state.rotations[c.id] || 0);
        state.positions[c.id] = {
          x: Math.max(0, Math.min(ROOM_W - bbox.bw, pos.x)),
          y: Math.max(0, Math.min(ROOM_D - bbox.bh, pos.y))
        };
      }
    });
  }
  toast('Loaded shared room');
}

/* ================= Theme ================= */
function currentTheme(){
  return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
}
function applyThemeChrome(){
  const dark = currentTheme() === 'dark';
  document.getElementById('themeToggle').textContent = dark ? '☀️' : '🌙';
  const paper = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim();
  document.getElementById('themeColorMeta').setAttribute('content', paper || (dark ? '#0E1220' : '#F5F3FA'));
}
function toggleTheme(){
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  if (next === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('theme', next);
  applyThemeChrome();
}
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');

/* Minimum viewport — desktop/tablet only. The drag-and-drop floor plan
   doesn't degrade gracefully to phone width. */
const MIN_VIEWPORT_WIDTH = 760; // every common tablet (iPad Mini and up) clears this — phone-only in practice
function checkViewportSize(){
  const blocked = window.innerWidth < MIN_VIEWPORT_WIDTH;
  document.getElementById('tooSmallBlock').style.display = blocked ? 'flex' : 'none';
  return blocked;
}
window.addEventListener('resize', checkViewportSize);

/* ================= Boot ================= */
(function boot(){
  applyThemeChrome();
  document.getElementById('footVersion').innerHTML = `Palette &amp; Plan · v${APP_VERSION} · Joe.K · <a href="https://axisbim.io" target="_blank" rel="noopener">axisbim.io</a>`;
  checkViewportSize(); // run on boot, not just on resize
  restoreFromHash(); // apply a shared-link state, if the URL has one, before first render
  render();
})();
</script>
